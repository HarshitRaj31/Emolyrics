<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoLyrics - Song Lyrics Emotion & Mood Classification</title>
    <meta name="description" content="AI & NLP powered Song Lyrics Mood Classifier. Discover emotional essence across 10 core mood spectrums across multilingual song lyrics." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("emolyrics_theme");
          var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-purple-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
