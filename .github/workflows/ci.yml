name: EmoLyrics CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Frontend: Install, Lint & Build Validation
  # ============================================================================
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Verify Production Build
        run: npm run build
        env:
          VITE_API_URL: /api

  # ============================================================================
  # 2. Backend: Install, Security & Test Suite
  # ============================================================================
  backend:
    name: Backend (Node.js + Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: ci-test-secret-key-32-characters-minimum

  # ============================================================================
  # 3. Python ML Service: Production Readiness & Regression Tests
  # ============================================================================
  ml-services:
    name: ML Services (FastAPI + PyTorch CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-services
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-services/requirements.txt

      - name: Install CPU-Only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ML Service Dependencies
        run: pip install -r requirements.txt

      - name: Run Stage 7 & Stage 9 Multilingual QA Test Suites
        run: |
          python tests/test_stage7_production.py
          python tests/test_stage9_multilingual_qa.py
        env:
          TORCH_NUM_THREADS: 2
          PREDICTION_CACHE_SIZE: 500
          MAX_INPUT_CHARS: 5000

